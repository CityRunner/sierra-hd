name: Toolchain image
description: >
  Builds the pinned toolchain image (docker/Dockerfile) for the runner's
  architecture, with layers cached in the GitHub Actions cache, and loads it
  under the tag that docker/run.sh expects.
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      run: echo "tag=$(docker/image-tag.sh)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docker
        file: docker/Dockerfile
        tags: ${{ steps.tag.outputs.tag }}
        load: true
        cache-from: type=gha,scope=toolchain-${{ runner.arch }}
        cache-to: type=gha,mode=max,scope=toolchain-${{ runner.arch }}
