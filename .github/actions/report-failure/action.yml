name: Report failure
description: >
  Publishes the tail of a failed step's log as an error annotation, so the
  cause is visible in the run summary and through the checks API without
  downloading the full log.
inputs:
  log:
    description: Path of the log file
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        LOG: ${{ inputs.log }}
      run: |
        if [[ -f "$LOG" ]]; then
          # Workflow commands take one line: escape % and join lines with %0A.
          # GitHub keeps only the first 4 KB of an annotation, so the error
          # lines get one of their own before the tail of the log.
          annotate() {
            tr -d '\r' | awk -v title="$1" 'BEGIN { printf "::error title=%s::", title } { gsub(/%/, "%25"); printf "%s%%0A", $0 } END { print "" }'
          }
          grep -E -A3 'error|FAILED|Failed|failed' "$LOG" | grep -v '^\[[0-9]*/[0-9]*\] Building' | head -n 40 | annotate "Errors in the log" || true
          tail -n 30 "$LOG" | annotate "Last lines of the log"
        fi
